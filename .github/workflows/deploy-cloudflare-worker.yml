name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/verify-cloudflare-production.sh"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Saisissez deploy-production pour déployer manuellement le Worker de production."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fractal-ordinal-live-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'deploy-production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Keep production deployment gated by the same quality checks as PR CI.
      - name: Type-check application
        run: pnpm check

      - name: Run client unit tests
        run: pnpm exec vitest run client/src/lib

      - name: Run Local Vault UTXO safety tests
        run: pnpm exec vitest run client/src/lib/protocol-utxo-safety.test.ts

      - name: Build desktop Local Vault extension
        run: pnpm run build:extension

      - name: Check shared Worker syntax
        run: node --check workers/fractal-ordinal-live.js

      - name: Test Worker request guards
        run: node --test workers/fractal-ordinal-live.test.mjs

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Build application
        run: pnpm build

      - name: Validate Wrangler bundle without publishing
        run: pnpm dlx wrangler@4.151.0 deploy --dry-run --outdir=/tmp/fractal-worker-dry-run

      - name: Smoke-test Worker in local workerd runtime
        run: bash scripts/smoke-worker-runtime.sh

      # Cloudflare adds the existing Durable Object namespace_id remotely,
      # while Wrangler's declarative config intentionally carries only the
      # class binding. Strict mode therefore rejects valid deployments as a
      # false-positive configuration conflict. Keep the remote namespace and
      # secret bindings; the production verification step below checks them.
      - name: Deploy to Cloudflare Workers
        run: pnpm dlx wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Cloudflare bindings and both production apps
        run: bash scripts/verify-cloudflare-production.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
