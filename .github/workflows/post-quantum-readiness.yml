name: Post-Quantum Security Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "workers/**"
      - "extension/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/post-quantum-readiness.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: post-quantum-watch-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto-readiness:
    name: Cryptography inventory and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Inventory cryptographic algorithms and wallet signing paths
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-report
          REPORT="security-report/post-quantum-readiness.md"
          {
            echo "# Post-quantum readiness inventory"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Scope: static source inventory; not a cryptographic proof or a protocol migration."
            echo
            echo "## Protocol compatibility warning"
            echo
            echo "Bitcoin and Fractal Bitcoin transaction signatures currently depend on protocol-supported signature schemes. This report does not claim those networks support post-quantum signatures. Do not replace transaction algorithms or address formats in application code without an approved network protocol change and interoperable wallet support."
            echo
            echo "## Classical cryptography / signing references"
            echo
          } > "$REPORT"
          SEARCH_PATHS=()
          for p in client workers extension scripts server; do
            [ ! -d "$p" ] || SEARCH_PATHS+=("$p")
          done
          if [ "${#SEARCH_PATHS[@]}" -gt 0 ]; then
            set +e
            grep -RInE --exclude='*.map' --exclude='*.min.js' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=coverage               '(secp256k1|ECDSA|Schnorr|BIP-340|BIP340|Taproot|x-only|bitcoinjs-lib|@bitcoinerlab/secp256k1|@noble/curves|elliptic|privateKey|signSchnorr|sign\()' "${SEARCH_PATHS[@]}"               > security-report/classical-crypto-references.txt
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              sed -n '1,250p' security-report/classical-crypto-references.txt >> "$REPORT"
              echo >> "$REPORT"
              echo "Note: matches are review leads, not proof of a vulnerability. Confirm the exact signing boundary and whether each reference is protocol-mandated." >> "$REPORT"
            elif [ "$rc" -eq 1 ]; then
              echo "No matching references found by the static search. This does not prove cryptography is absent." >> "$REPORT"
            else
              echo "Static search failed with exit code $rc." >> "$REPORT"
              exit "$rc"
            fi
          else
            echo "No expected source directories found; inspect repository layout." >> "$REPORT"
          fi
          {
            echo
            echo "## Post-quantum implementation indicators"
            echo
          } >> "$REPORT"
          set +e
          grep -RInE --exclude='*.map' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git             '(ML-KEM|ML-DSA|SLH-DSA|FIPS[ -]203|FIPS[ -]204|FIPS[ -]205|post.?quantum|quantum.?resistan)' "${SEARCH_PATHS[@]}"             > security-report/pqc-indicators.txt 2>/dev/null
          pqc_rc=$?
          set -e
          if [ "$pqc_rc" -eq 0 ]; then
            sed -n '1,150p' security-report/pqc-indicators.txt >> "$REPORT"
            echo >> "$REPORT"
            echo "These are indicators only; verify implementation, provenance, key handling, and interoperability manually." >> "$REPORT"
          elif [ "$pqc_rc" -eq 1 ]; then
            echo "No explicit PQC indicators found in scanned source paths. This is not by itself a vulnerability; Bitcoin/Fractal protocol support is the deciding constraint." >> "$REPORT"
          else
            echo "PQC indicator search failed with exit code $pqc_rc." >> "$REPORT"
            exit "$pqc_rc"
          fi
          {
            echo
            echo "## Required transaction safety invariants"
            echo
            echo "- Keep private keys and seed phrases local; never send them to CI, AI services, logs, issues, or third-party APIs."
            echo "- Keep UniSat signing separate from Ordi Wallet Local Vault signing."
            echo "- Do not bypass fresh UTXO/indexer checks, PSBT input/output validation, fee limits, network separation, or user confirmation."
            echo "- Never automatically sign, broadcast, or move BTC/FB, Ordinals, Runes, or BRC-20 assets from this workflow."
            echo "- Any future PQC experiment must use test vectors/testnet or isolated fixtures and must not alter production address or transaction formats."
            echo
            echo "## Recommended next steps"
            echo
            echo "1. Review dependency-audit output and remediate confirmed advisories through a reviewed pull request."
            echo "2. Maintain a cryptographic inventory of address derivation, key generation, signing, PSBT validation, and wallet-provider boundaries."
            echo "3. Track Bitcoin and Fractal protocol proposals before planning any signature migration."
            echo "4. Require independent cryptographic review and regression tests before merging changes touching signing or transaction construction."
          } >> "$REPORT"

      - name: Upload security inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-quantum-readiness-${{ github.run_id }}
          path: security-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark high-severity dependency audit failures
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::High-severity dependency audit failed. Review the audit output and submit a reviewed dependency-update PR."
          exit 1
