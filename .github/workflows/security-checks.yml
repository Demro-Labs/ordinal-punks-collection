name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run client unit tests
        run: pnpm exec vitest run client/src/lib

      - name: Check shared Worker syntax
        run: node --check workers/fractal-ordinal-live.js

      - name: Test Worker request guards
        run: node --test workers/fractal-ordinal-live.test.mjs

      - name: Validate Wrangler configuration and bundle
        run: pnpm dlx wrangler@4.151.0 deploy --dry-run --outdir=/tmp/fractal-worker-dry-run

      - name: Smoke-test Worker in local workerd runtime
        run: bash scripts/smoke-worker-runtime.sh

      - name: Audit all dependencies
        run: pnpm audit --audit-level=low

      - name: Build static site
        run: pnpm build
